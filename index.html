<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>키오스크 주문연습</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#182538;font-family:system-ui,'Malgun Gothic',sans-serif}main{max-width:1000px;margin:24px auto;padding:20px}.panel{background:white;border-radius:26px;padding:clamp(18px,4vw,36px);box-shadow:0 8px 28px #26384d14}h1{text-align:center;font-size:clamp(29px,4vw,44px);margin:0 0 10px}h2{text-align:center;font-size:clamp(23px,3vw,32px);margin:12px 0 26px}.hint{text-align:center;font-size:clamp(20px,2.6vw,27px);font-weight:750;margin:10px 0 24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.menu{border:4px solid #d9e2ec;border-radius:20px;background:#fff;padding:18px 8px;text-align:center;cursor:pointer;min-height:185px}.menu:active{border-color:#168044;background:#e7f8ee;transform:scale(.98)}.menu:focus-visible{outline:5px solid #e9a91a;outline-offset:3px}.taphelp{display:block;font-size:18px;color:#176b43;font-weight:800;margin-top:9px}.emoji{font-size:clamp(48px,7vw,76px);display:block}.name{font-size:clamp(20px,2.7vw,30px);font-weight:800}.price{font-size:clamp(20px,2.7vw,29px);font-weight:750}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}button{font:inherit;font-size:clamp(19px,2.4vw,27px);font-weight:800;border:0;border-radius:16px;padding:17px 20px;min-height:64px;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:5px solid #e9a91a;outline-offset:3px}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#176b43;color:white;flex:1}.secondary{background:#e1e8f0;color:#17263b;flex:1}.add{background:#176b43;color:white;width:100%;margin-top:12px}.cart{background:#f4f7fa;border-radius:20px;padding:20px;margin-top:24px}.cart-help{font-size:clamp(18px,2.4vw,23px);font-weight:650;margin:0 0 12px}.cart h3{font-size:clamp(23px,3vw,31px);margin:0 0 16px}.cartline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:2px solid #dbe3eb;flex-wrap:wrap}.cartline strong{font-size:clamp(20px,2.5vw,26px)}.qty{display:flex;align-items:center;gap:12px}.qty button{width:58px;height:58px;min-height:58px;padding:0;background:#d9e4ee}.qty span{font-size:27px;font-weight:850;min-width:28px;text-align:center}.remove{background:#ffe5e5;color:#8a1820;font-size:20px;min-height:54px;padding:10px 15px}.itemdetails{font-size:20px;line-height:1.5}.total{font-size:clamp(24px,3.5vw,36px);font-weight:900;text-align:right;margin:20px 0}.center{text-align:center}.number{font-size:clamp(64px,12vw,110px);font-weight:950;color:#1758a4;margin:4px 0}.notice{font-size:clamp(17px,2vw,21px);text-align:center;background:#e9eff6;padding:15px;border-radius:15px;margin-top:24px}.summary{font-size:clamp(21px,2.8vw,30px);line-height:1.9}.done{font-size:clamp(28px,4vw,43px);color:#137343}.hidden{display:none!important}@media(max-width:560px){main{margin:0;padding:10px}.panel{border-radius:16px}.grid{gap:7px}.menu{padding:12px 4px;min-height:155px;border-width:3px}.cartline{align-items:flex-start}.actions{flex-direction:column}.actions button{width:100%}}
</style></head><body><main><div class="panel"><h1>🍽️ 키오스크 주문연습</h1><section id="selection"><h2>먹고싶은 메뉴를 골라요.</h2><p class="cart-help center">그림을 누르면 장바구니에 1개씩 담겨요.</p><div class="grid" id="menus"></div><div class="cart"><h3>🛒 하나의 장바구니</h3><p class="cart-help">김밥, 떡볶이, 꼬치오뎅, 순대를 모두 여기에 담아요.</p><div id="cartItems" aria-live="polite"></div><div class="total" id="cartQty">총수량 0개</div><div class="total" id="cartTotal">합계금액 0원</div></div><div class="actions"><button class="secondary" id="reset">다시 시작</button><button class="primary" id="reviewBtn" disabled>주문 확인 →</button></div></section><section id="review" class="hidden"><h2>주문 확인</h2><div class="hint">이 메뉴를 주문할까요?</div><div class="cart summary" id="reviewItems"></div><div class="total" id="reviewQty"></div><div class="total" id="reviewTotal"></div><div class="actions"><button class="secondary" id="back">다시 고르기</button><button class="primary" id="order">주문하기</button></div></section><section id="complete" class="hidden center"><h2 class="done">🎉 주문 연습을 마쳤어요!</h2><div class="cart summary" id="doneItems"></div><div class="total" id="doneQty"></div><div class="total" id="doneTotal"></div><div class="hint">연습용 주문번호</div><div class="number">001</div><div class="hint">번호가 불리면 음식을 받아요</div><button class="primary" id="again" style="width:100%">🔄 다시 연습하기</button></section><div class="notice">연습용 화면이며 실제 주문과 결제는 되지 않아요.</div></div></main><script>
'use strict';const products=[{name:'김밥',price:3000,emoji:'🍙'},{name:'떡볶이',price:3500,emoji:'🍲'},{name:'꼬치오뎅',price:1000,emoji:'🍢'},{name:'순대',price:3000,emoji:'🥘'}];const counts=products.map(()=>0);const $=id=>document.getElementById(id);const money=n=>n.toLocaleString('ko-KR')+'원';function total(){return products.reduce((s,p,i)=>s+p.price*counts[i],0)}function quantity(){return counts.reduce((a,b)=>a+b,0)}function show(page){['selection','review','complete'].forEach(id=>$(id).classList.toggle('hidden',id!==page));window.scrollTo(0,0)}function render(){ $('menus').innerHTML=products.map((p,i)=>`<div><button type="button" class="menu" data-add="${i}" aria-label="${p.name} 그림 누르면 장바구니에 담기" style="width:100%"><span class="emoji">${p.emoji}</span><span class="name">${p.name}</span><br><span class="price">${money(p.price)}</span><span class="taphelp">👆 그림 눌러 담기</span></button><button class="add" data-add="${i}">+ 담기</button></div>`).join('');$('cartItems').innerHTML=counts.some(Boolean)?products.map((p,i)=>counts[i]?`<div class="cartline"><div><strong>${p.emoji} ${p.name}</strong><div class="itemdetails">단가 ${money(p.price)} · ${counts[i]}개<br>메뉴 금액 ${money(p.price*counts[i])}</div></div><div class="qty"><button data-minus="${i}" aria-label="${p.name} 한 개 빼기">−</button><span>${counts[i]}</span><button data-plus="${i}" aria-label="${p.name} 한 개 더하기">+</button><button class="remove" data-remove="${i}" aria-label="${p.name} 삭제">삭제</button></div></div>`:'').join(''):'<p class="hint">아직 담은 메뉴가 없어요.</p>';$('cartQty').textContent='총수량 '+quantity()+'개';$('cartTotal').textContent='합계금액 '+money(total());$('reviewBtn').disabled=!counts.some(Boolean)}function summary(){return products.map((p,i)=>counts[i]?`<div class="cartline"><div><strong>${p.emoji} ${p.name} × ${counts[i]}개</strong><div class="itemdetails">단가 ${money(p.price)}</div></div><strong>${money(p.price*counts[i])}</strong></div>`:'').join('')}function reset(){counts.fill(0);render();show('selection')}$('menus').addEventListener('click',e=>{const b=e.target.closest('button[data-add]');if(!b)return;counts[Number(b.dataset.add)]++;render()});$('cartItems').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.minus!==undefined)counts[Number(b.dataset.minus)]=Math.max(0,counts[Number(b.dataset.minus)]-1);if(b.dataset.plus!==undefined)counts[Number(b.dataset.plus)]++;if(b.dataset.remove!==undefined)counts[Number(b.dataset.remove)]=0;render()});$('reviewBtn').onclick=()=>{if(!counts.some(Boolean))return;$('reviewItems').innerHTML=summary();$('reviewQty').textContent='총수량 '+quantity()+'개';$('reviewTotal').textContent='합계금액 '+money(total());show('review')};$('back').onclick=()=>show('selection');$('order').onclick=()=>{$('doneItems').innerHTML=summary();$('doneQty').textContent='총수량 '+quantity()+'개';$('doneTotal').textContent='합계금액 '+money(total());show('complete')};$('again').onclick=reset;$('reset').onclick=reset;render();
</script></body></html>
